name: notify-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要通知的 tag，例如 v0.5.0"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "要通知的 tag"
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Telegram message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 可选：频道和群组不是同一个 chat 时，再加这个 secret
          TG_GROUP_CHAT: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 未配置，跳过通知"
            exit 0
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 不存在"
            exit 1
          fi

          VER="${TAG#v}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log --no-merges --pretty=format:'• %s' "${PREV}..${TAG}" \
              | grep -vE '^• (docs|ci|chore)(\(|:| )' | head -12 || true)
          else
            CHANGES=$(git log --no-merges --pretty=format:'• %s' -n 10 "$TAG" || true)
          fi
          [ -z "$CHANGES" ] && CHANGES="• 无功能变更（仅文档 / CI）"
          CHANGES=$(printf '%s' "$CHANGES" \
            | sed -E 's/^• (feat|fix|perf|refactor)(\([^)]*\))?: /• /' \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

          MSG=$(printf '<b>LimeCine %s 已发布</b>\n\n<b>本次更新</b>\n%s\n\n镜像：<code>lixxh/limecine:%s</code> / <code>latest</code>\n平台：linux/amd64 · linux/arm64\n升级：<code>docker compose pull && docker compose up -d</code>\n\n%s' \
            "$TAG" "$CHANGES" "$VER" "https://github.com/${GITHUB_REPOSITORY}")

          CHATS="${TG_CHAT}"
          if [ -n "${TG_GROUP_CHAT:-}" ] && [ "${TG_GROUP_CHAT}" != "${TG_CHAT}" ]; then
            CHATS="${CHATS} ${TG_GROUP_CHAT}"
          fi

          for CHAT in $CHATS; do
            resp=$(curl -sS --retry 3 --retry-delay 5 \
              -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=${MSG}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              -w "\nHTTP %{http_code}") || true
            echo "$resp"
            { echo '```'; echo "$resp"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            case "$resp" in
              *'"ok":true'*) echo "Telegram 通知已发送 chat=${CHAT}" ;;
              *) echo "Telegram 通知失败 chat=${CHAT}（不影响发布）" ;;
            esac
          done
